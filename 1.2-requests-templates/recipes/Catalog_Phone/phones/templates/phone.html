<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>{{ phone.name }}</h1>
<img src="{{ phone.image }}" alt="{{ phone.name }}" width="300">
<p>Цена: {{ phone.price }} руб.</p>
<p>Дата выхода: {{ phone.release_date }}</p>
<p>Поддержка LTE: {% if phone.lte_exists %}Да{% else %}Нет{% endif %}</p>
<a href="{% url 'catalog' %}">Вернуться в каталог</a>
</body>
</html>
